name: Validate Studio and ComfyUI workflows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/start.sh
      - run: node --check web/studio.js
      - run: python scripts/export_workflows.py && git diff --exit-code -- scenes workflows
  comfy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMFYUI_PATH: ${{ github.workspace }}/.runtime/ComfyUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Fetch the pinned ComfyUI revision
        run: |
          git init "$COMFYUI_PATH"
          git -C "$COMFYUI_PATH" remote add origin https://github.com/Comfy-Org/ComfyUI.git
          git -C "$COMFYUI_PATH" fetch --depth 1 origin "$(python -c 'import json; print(json.load(open("comfy.lock.json"))["commit"])')"
          git -C "$COMFYUI_PATH" checkout --detach FETCH_HEAD
      - name: Install CPU-only validation runtime
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip freeze | grep -E '^(torch|torchvision|torchaudio)==' > .runtime/torch-constraints.txt
          pip install -c .runtime/torch-constraints.txt -r "$COMFYUI_PATH/requirements.txt" -r requirements.txt
      - run: python scripts/check_runtime.py --comfy-dir "$COMFYUI_PATH" --cpu
      - run: python scripts/check_comfy_integration.py
