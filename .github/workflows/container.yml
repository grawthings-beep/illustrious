name: Build RunPod image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/grawthings-beep/illustrious:latest,ghcr.io/grawthings-beep/illustrious:cuda12,ghcr.io/grawthings-beep/illustrious:cuda12-${{ github.sha }},ghcr.io/grawthings-beep/illustrious:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
